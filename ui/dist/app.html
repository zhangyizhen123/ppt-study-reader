<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PPT 伴读</title>
  <style>:root {
  color-scheme: light dark;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--color-background-primary, #ffffff);
  color: var(--color-text-primary, #1e293b);
  font-family: var(--font-sans, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
  font-size: 13px;
  line-height: 1.4;
  overflow: hidden;
}

[data-theme="dark"] body {
  background: var(--color-background-primary, #111827);
  color: var(--color-text-primary, #f1f5f9);
}

#app {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100vh;
  min-height: 440px;
}

html.is-inline #app {
  height: var(--inline-app-height, 560px);
  max-height: 100vh;
}

.hidden {
  display: none !important;
}

/* Top Toolbar */
.toolbar {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 8px 10px;
  background: var(--color-background-secondary, #f8fafc);
  border-bottom: 1px solid var(--color-border-primary, #e2e8f0);
  flex-shrink: 0;
}

[data-theme="dark"] .toolbar {
  background: var(--color-background-secondary, #1e293b);
  border-bottom-color: var(--color-border-primary, #334155);
}

.toolbar-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.deck-select {
  flex: 1;
  min-width: 160px;
  padding: 4px 8px;
  border-radius: 6px;
  border: 1px solid var(--color-border-primary, #cbd5e1);
  background: var(--color-background-primary, #ffffff);
  color: var(--color-text-primary, #0f172a);
  font-size: 12px;
  font-weight: 600;
}

[data-theme="dark"] .deck-select {
  background: var(--color-background-primary, #0f172a);
  color: var(--color-text-primary, #f1f5f9);
  border-color: var(--color-border-primary, #475569);
}

.seg-group {
  display: inline-flex;
  border-radius: 6px;
  border: 1px solid var(--color-border-primary, #cbd5e1);
  overflow: hidden;
  background: var(--color-background-primary, #ffffff);
}

[data-theme="dark"] .seg-group {
  background: var(--color-background-primary, #0f172a);
  border-color: var(--color-border-primary, #475569);
}

.seg-btn {
  border: none;
  background: transparent;
  color: var(--color-text-secondary, #475569);
  padding: 3px 8px;
  font-size: 11.5px;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s, color 0.15s;
}

.seg-btn + .seg-btn {
  border-left: 1px solid var(--color-border-primary, #e2e8f0);
}

[data-theme="dark"] .seg-btn + .seg-btn {
  border-left-color: #334155;
}

.seg-btn.active {
  background: #2563eb;
  color: #ffffff;
  font-weight: 600;
}

.icon-btn {
  border: 1px solid var(--color-border-primary, #cbd5e1);
  background: var(--color-background-primary, #ffffff);
  color: var(--color-text-primary, #334155);
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 11.5px;
  cursor: pointer;
  white-space: nowrap;
}

[data-theme="dark"] .icon-btn {
  background: var(--color-background-primary, #0f172a);
  color: var(--color-text-primary, #e2e8f0);
  border-color: #475569;
}

.icon-btn:hover:not(:disabled) {
  border-color: #2563eb;
}

.icon-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

/* Status Ribbon */
.ribbon {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border-bottom: 1px solid var(--color-border-primary, #e2e8f0);
  font-size: 12px;
  flex-shrink: 0;
}

.ribbon.prio-high {
  background: rgba(22, 163, 74, 0.1);
  border-bottom-color: rgba(22, 163, 74, 0.25);
}

.ribbon.prio-medium {
  background: rgba(217, 119, 6, 0.1);
  border-bottom-color: rgba(217, 119, 6, 0.25);
}

.ribbon.prio-low {
  background: rgba(220, 38, 38, 0.08);
  border-bottom-color: rgba(220, 38, 38, 0.2);
}

.prio-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  color: #ffffff;
  border: none;
  cursor: pointer;
  flex-shrink: 0;
}

.prio-pill.high { background: #16a34a; }
.prio-pill.medium { background: #d97706; }
.prio-pill.low { background: #dc2626; }

.tag-badge {
  font-weight: 600;
  color: var(--color-text-primary, #0f172a);
  flex-shrink: 0;
}

[data-theme="dark"] .tag-badge {
  color: var(--color-text-primary, #f1f5f9);
}

.tip-text {
  color: var(--color-text-secondary, #475569);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}

[data-theme="dark"] .tip-text {
  color: var(--color-text-secondary, #cbd5e1);
}

/* Main Stage */
.main-area {
  position: relative;
  flex: 1;
  display: flex;
  overflow: hidden;
}

.stage-scroll {
  flex: 1;
  overflow: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: var(--color-background-tertiary, #f1f5f9);
}

[data-theme="dark"] .stage-scroll {
  background: var(--color-background-tertiary, #090d16);
}

.slide-frame {
  position: relative;
  width: 100%;
  max-width: 960px;
  background: #ffffff;
  border-radius: 6px;
  box-shadow: 0 3px 16px rgba(0, 0, 0, 0.14);
  overflow: hidden;
  flex-shrink: 0;
  touch-action: none;
  border-top: 4px solid #16a34a;
}

.slide-frame.prio-high { border-top-color: #16a34a; }
.slide-frame.prio-medium { border-top-color: #d97706; }
.slide-frame.prio-low { border-top-color: #dc2626; }

.slide-frame.zoomed {
  width: 145%;
  max-width: none;
}

.slide-frame.mode-box {
  cursor: crosshair;
  user-select: none;
  -webkit-user-select: none;
}

.slide-frame.mode-text {
  cursor: text;
}

.slide-img {
  display: block;
  width: 100%;
  height: auto;
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
}

/* Empty Onboarding Card */
.empty-card {
  max-width: 440px;
  margin: 32px auto;
  padding: 18px 20px;
  border-radius: 10px;
  background: var(--color-background-primary, #ffffff);
  border: 1px solid var(--color-border-primary, #cbd5e1);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

[data-theme="dark"] .empty-card {
  background: var(--color-background-secondary, #1e293b);
  border-color: #334155;
}

.empty-card h3 {
  margin: 0;
  font-size: 15px;
  color: var(--color-text-primary, #0f172a);
}

[data-theme="dark"] .empty-card h3 {
  color: #f8fafc;
}

.empty-card p, .empty-card ol {
  margin: 0;
  font-size: 12.5px;
  color: var(--color-text-secondary, #475569);
}

[data-theme="dark"] .empty-card p, [data-theme="dark"] .empty-card ol {
  color: #cbd5e1;
}

.empty-card ol {
  padding-left: 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.empty-card code {
  padding: 1px 5px;
  border-radius: 4px;
  background: rgba(37, 99, 235, 0.1);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11.5px;
}

/* Box Selection & Word Highlight Layers */
.overlay-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.word-hl {
  position: absolute;
  background: rgba(59, 130, 246, 0.25);
  border-bottom: 2px solid rgba(37, 99, 235, 0.7);
  border-radius: 2px;
}

.word-hl.longpress-pulse {
  background: rgba(245, 158, 11, 0.32);
  border-bottom-color: #d97706;
  animation: pulseFlash 0.35s ease-out;
}

@keyframes pulseFlash {
  0% { transform: scaleY(1.18); background: rgba(245, 158, 11, 0.55); }
  100% { transform: scaleY(1); background: rgba(245, 158, 11, 0.32); }
}

.sel-rect {
  position: absolute;
  border: 2px dashed #2563eb;
  background: rgba(37, 99, 235, 0.12);
  border-radius: 4px;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.5) inset;
}

/* Transparent Selectable Text Layer for Pure Text Mode */
.text-layer {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.slide-frame.mode-text .text-layer {
  pointer-events: auto;
}

.text-word {
  position: absolute;
  color: transparent;
  white-space: pre;
  line-height: 1;
  user-select: text;
  -webkit-user-select: text;
  display: flex;
  align-items: center;
  overflow: hidden;
}

.text-word::selection {
  background: rgba(37, 99, 235, 0.36);
  color: transparent;
}

/* Hint strip under slide */
.stage-hint {
  margin-top: 8px;
  font-size: 11px;
  color: var(--color-text-tertiary, #64748b);
  text-align: center;
}

/* Outline Drawer */
.outline-drawer {
  width: 220px;
  border-left: 1px solid var(--color-border-primary, #e2e8f0);
  background: var(--color-background-secondary, #f8fafc);
  overflow-y: auto;
  flex-shrink: 0;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

[data-theme="dark"] .outline-drawer {
  background: var(--color-background-secondary, #1e293b);
  border-left-color: #334155;
}

.outline-drawer.hidden {
  display: none;
}

.outline-item {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  padding: 5px 6px;
  border-radius: 5px;
  border: none;
  background: transparent;
  color: var(--color-text-primary, #1e293b);
  text-align: left;
  cursor: pointer;
  font-size: 11.5px;
  width: 100%;
}

[data-theme="dark"] .outline-item {
  color: var(--color-text-primary, #e2e8f0);
}

.outline-item:hover {
  background: rgba(37, 99, 235, 0.08);
}

.outline-item.active {
  background: rgba(37, 99, 235, 0.16);
  font-weight: 600;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-top: 4px;
  flex-shrink: 0;
}
.dot.high { background: #16a34a; }
.dot.medium { background: #d97706; }
.dot.low { background: #dc2626; }

/* Bottom Navigation */
.footer-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 10px;
  background: var(--color-background-secondary, #f8fafc);
  border-top: 1px solid var(--color-border-primary, #e2e8f0);
  flex-shrink: 0;
}

[data-theme="dark"] .footer-nav {
  background: var(--color-background-secondary, #1e293b);
  border-top-color: #334155;
}

.page-jump {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
}

.page-input {
  width: 46px;
  padding: 2px 4px;
  text-align: center;
  border: 1px solid var(--color-border-primary, #cbd5e1);
  border-radius: 4px;
  background: var(--color-background-primary, #ffffff);
  color: var(--color-text-primary, #0f172a);
  font-size: 12px;
}

[data-theme="dark"] .page-input {
  background: #0f172a;
  color: #f1f5f9;
  border-color: #475569;
}

/* Floating Ask Popover */
.ask-popover {
  position: fixed;
  z-index: 100;
  width: 316px;
  max-width: calc(100vw - 16px);
  background: var(--color-background-primary, #ffffff);
  color: var(--color-text-primary, #0f172a);
  border: 1px solid var(--color-border-primary, #cbd5e1);
  border-radius: 10px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

[data-theme="dark"] .ask-popover {
  background: #1e293b;
  color: #f1f5f9;
  border-color: #475569;
}

.ask-popover.hidden {
  display: none;
}

.ask-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.ask-title {
  font-size: 12px;
  font-weight: 700;
  color: #2563eb;
}

[data-theme="dark"] .ask-title {
  color: #60a5fa;
}

.ask-close {
  border: none;
  background: transparent;
  color: var(--color-text-tertiary, #64748b);
  font-size: 15px;
  cursor: pointer;
  padding: 0 4px;
}

.ask-preview {
  font-size: 11.5px;
  background: var(--color-background-secondary, #f8fafc);
  border: 1px solid var(--color-border-primary, #e2e8f0);
  border-radius: 6px;
  padding: 6px 8px;
  max-height: 66px;
  overflow-y: auto;
  word-break: break-word;
  color: var(--color-text-secondary, #334155);
}

[data-theme="dark"] .ask-preview {
  background: #0f172a;
  border-color: #334155;
  color: #cbd5e1;
}

.ask-check {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  cursor: pointer;
}

.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.chip-btn {
  border: 1px solid rgba(37, 99, 235, 0.35);
  background: rgba(37, 99, 235, 0.08);
  color: #1d4ed8;
  border-radius: 999px;
  padding: 3px 9px;
  font-size: 11.5px;
  font-weight: 500;
  cursor: pointer;
}

[data-theme="dark"] .chip-btn {
  color: #93c5fd;
  background: rgba(37, 99, 235, 0.2);
}

.chip-btn:hover {
  background: #2563eb;
  color: #ffffff;
}

.ask-input-row {
  display: flex;
  gap: 5px;
}

.ask-input {
  flex: 1;
  min-width: 0;
  padding: 5px 8px;
  border-radius: 6px;
  border: 1px solid var(--color-border-primary, #cbd5e1);
  background: var(--color-background-primary, #ffffff);
  color: var(--color-text-primary, #0f172a);
  font-size: 12px;
}

[data-theme="dark"] .ask-input {
  background: #0f172a;
  color: #f1f5f9;
  border-color: #475569;
}

.btn-primary {
  border: none;
  background: #2563eb;
  color: #ffffff;
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}

.btn-primary:disabled {
  opacity: 0.55;
  cursor: wait;
}

.ask-actions-sub {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
}

.btn-secondary {
  border: 1px solid var(--color-border-primary, #cbd5e1);
  background: transparent;
  color: var(--color-text-secondary, #475569);
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 11px;
  cursor: pointer;
}

[data-theme="dark"] .btn-secondary {
  color: #cbd5e1;
  border-color: #475569;
}

.toast {
  position: fixed;
  bottom: 46px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(15, 23, 42, 0.9);
  color: #ffffff;
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 11.5px;
  z-index: 150;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
}

.toast.show {
  opacity: 1;
}

.loading-banner {
  padding: 40px 16px;
  text-align: center;
  color: var(--color-text-secondary, #64748b);
  font-size: 12.5px;
}
</style>
